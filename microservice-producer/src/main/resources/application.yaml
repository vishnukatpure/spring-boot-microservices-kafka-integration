spring:
    application:
        name: microservice-producer
    lifecycle:
        # Maximum time allowed for ongoing requests/tasks to complete
        timeout-per-shutdown-phase: 30s
    config:
        import: optional:classpath:application-config.yaml
    datasource:
        url: jdbc:mysql://localhost:3306/demo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

        # Its Default Configuration this can be changed based on requirement
        hikari:
            pool-name: PersonHikariPool
            maximum-pool-size: 10
            minimum-idle: 10
            connection-timeout: 30000 # 30 Sec
            idle-timeout: 600000 # 10 min
            max-lifetime: 1800000 #30 min
            validation-timeout: 5000 #5 Sec
            leak-detection-threshold: 60000 #60 sec
    jpa:
        # database-platform: org.hibernate.dialect.MySQLDialect
        # Hide/ show query
        show-sql: false
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                "[format_sql]": true

    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.LongSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
            acks: all
            retries: 3
            properties:
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5
    cache:
        type: redis
        redis:
            # time-to-live: 10m
            cache-null-values: false
    data:
        redis:
            host: localhost
            port: 6379
            connect-timeout: 2s
            timeout: 2s
            repositories:
                enabled: false

server:
    port: 8081
    # Gracefully complete in-flight HTTP requests before shutting down
    shutdown: graceful

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: when_authorized
info:
    app:
        name: Kafka Producer Service
        version: 1.0.0
        description: Kafka Producer Microservice

app:
    jwt:
        secret: ${JWT_SECRET:=======================Spring=Security==========================}
        expiration-seconds: ${JWT_EXPIRATION_SECONDS:300}
    encryption:
        # Keep default "secret" so existing encrypted DB values still decrypt (SecurityUtil unchanged).
        secret-key: ${ENCRYPTION_SECRET_KEY:secret}

logging:
    level:
        "[org.springframework.security]": INFO
        "[org.springframework.web]": INFO

api-rate-limit:
    endpoints:
        - path: /person
          method: POST
          capacity: 10
          refill-minutes: 1

        - path: /person/all
          method: GET
          capacity: 1
          refill-minutes: 1
aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    s3:
        bucket: ${AWS_S3_BUCKET}
